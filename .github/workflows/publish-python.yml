name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Verify tag matches Python package version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")
          test "$RELEASE_REF" = "v${PACKAGE_VERSION}" || { echo "Tag does not match Python package version"; exit 1; }
      - run: python -m pip install -U pip build twine
      - run: python -m pip install -e './python[dev]'
      - run: python -m pytest python/tests
      - run: python -m build python --outdir python/dist
      - run: python -m twine check python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - name: Verify approved release commit
        env:
          EXPECTED_RELEASE_SHA: ${{ vars.RESEMBLIO_MCP_RELEASE_SHA }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test -n "$EXPECTED_RELEASE_SHA" || { echo "Missing approved release SHA"; exit 1; }
          test "$RELEASE_SHA" = "$EXPECTED_RELEASE_SHA" || { echo "Release SHA is not approved"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: python-package-dist
          path: python/dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
