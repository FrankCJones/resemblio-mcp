name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved release identity
        env:
          EXPECTED_RELEASE_SHA: ${{ vars.RESEMBLIO_MCP_RELEASE_SHA }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          test -n "$EXPECTED_RELEASE_SHA" || { echo "Missing approved release SHA"; exit 1; }
          test "$RELEASE_SHA" = "$EXPECTED_RELEASE_SHA" || { echo "Release SHA is not approved"; exit 1; }
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_REF" = "v${PACKAGE_VERSION}" || { echo "Tag does not match package version"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install trusted-publishing npm client
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm_config_dry_run=true npm pack
      - name: Publish through npm trusted publishing
        run: npm publish
