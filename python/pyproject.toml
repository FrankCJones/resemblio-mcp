[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "resemblio-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Resemblio - extract trademark-stripped, brand-faithful, code-bearing design systems from any URL. Inspirado, no copiado."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Frank Jones", email = "frank@optsus.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "resemblio", "design-tokens", "design-system", "dtcg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://resemblio.com"
Repository = "https://github.com/FrankCJones/resemblio-mcp"
Issues = "https://github.com/FrankCJones/resemblio-mcp/issues"

[project.scripts]
resemblio-mcp = "resemblio_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resemblio_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
